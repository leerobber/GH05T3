name: deploy-aethyro

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements-ci.txt

      - name: Run OSS economy tests
        run: python -m pytest tests/test_oss_economy.py -v --tb=short

  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: yarn build
        env:
          REACT_APP_GW3_URL: https://api.aethyro.com
          CI: "false"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && echo "CLOUDFLARE_API_TOKEN not configured — skipping deploy" && exit 0
          npx wrangler pages deploy frontend/build \
            --project-name="${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}" \
            --branch=main
        continue-on-error: true
