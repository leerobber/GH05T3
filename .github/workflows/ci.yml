name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend unit tests + syntax checks ───────────────────────────────────────
  backend:
    name: Backend — tests & syntax
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('backend/requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install CI dependencies
        run: pip install -r backend/requirements-ci.txt

      - name: Syntax check — backend gateway
        run: python -m py_compile backend/gateway_v3.py

      - name: Syntax check — sovereign economy client
        run: python -m py_compile backend/sovereign_economy.py

      - name: Syntax check — training pipeline
        run: |
          for f in pre_train.py runpod_launcher.py kairos_dataset_gen.py \
                   mentor_trainer.py avery_flywheel.py merge_on_runpod.py \
                   herald.py cmd_listener.py train_sovereign_sft.py \
                   multiturn_gen.py ghost_trainer.py push_hf_cards.py; do
            if [ -f "$f" ]; then
              echo "  py_compile $f"
              python -m py_compile "$f"
            fi
          done

      - name: Run backend unit tests (live-server tests auto-skipped)
        working-directory: backend
        env:
          PYTEST_ASYNCIO_MODE: auto
        run: pytest tests/ -v -m "not live and not integration"

      - name: Start local backend
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: gh05t3_ci
          LLM_PROVIDER: ollama
          COST_FREE_ONLY: "1"
          SOVEREIGN_CORE_URL: http://localhost:8000
        run: |
          uvicorn server:app --host 0.0.0.0 --port 8001 &
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8001/api/health || (echo "Backend failed to start" && exit 1)

      - name: Run backend integration tests
        working-directory: backend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: gh05t3_ci
          LLM_PROVIDER: ollama
          COST_FREE_ONLY: "1"
          SOVEREIGN_CORE_URL: http://localhost:8000
        run: pytest tests/ -q --tb=short

      - name: Run root unit tests
        run: pytest tests/ -v
        env:
          PYTHONPATH: backend

  # ── Frontend build check ──────────────────────────────────────────────────────
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_GW3_URL: http://localhost:8002
          CI: "false"
        run: yarn build
