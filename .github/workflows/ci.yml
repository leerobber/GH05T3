name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend unit tests + syntax checks ───────────────────────────────────────
  backend:
    name: Backend — tests & syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('backend/requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install CI dependencies
        run: pip install -r backend/requirements-ci.txt

      - name: Syntax check — backend gateway
        run: python -m py_compile backend/gateway_v3.py

      - name: Syntax check — sovereign economy client
        run: python -m py_compile backend/sovereign_economy.py

      - name: Syntax check — training pipeline
        run: |
          for f in scripts/training/pre_train.py \
                   scripts/training/runpod_launcher.py \
                   scripts/training/kairos_dataset_gen.py \
                   scripts/training/mentor_trainer.py \
                   scripts/training/avery_flywheel.py \
                   scripts/training/merge_on_runpod.py \
                   scripts/runtime/herald.py \
                   scripts/runtime/cmd_listener.py \
                   scripts/training/train_sovereign_sft.py \
                   scripts/training/multiturn_gen.py \
                   scripts/training/ghost_trainer.py \
                   scripts/training/push_hf_cards.py; do
            if [ -f "$f" ]; then
              echo "  py_compile $f"
              python -m py_compile "$f"
            fi
          done

      - name: Run backend unit tests (live-server tests auto-skipped)
        working-directory: backend
        env:
          PYTEST_ASYNCIO_MODE: auto
          AETHYRO_SKIP_LICENSE: "1"
        run: pytest tests/ -v -m "not live and not integration"

      - name: Run root unit tests
        run: pytest tests/ -v
        env:
          PYTHONPATH: backend
          AETHYRO_SKIP_LICENSE: "1"

  # ── Frontend build check ──────────────────────────────────────────────────────
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_GW3_URL: http://localhost:8002
          CI: "false"
        run: yarn build
