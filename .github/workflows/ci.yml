name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_staging_smoke:
        description: "Run staging smoke verification"
        required: false
        default: "false"
        type: boolean

env:
  PACT_CONSUMER: gh05t3-gateway
  PACT_PROVIDER: gh05t3-oss

jobs:
  backend:
    name: Backend — tests & syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('backend/requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install CI dependencies
        run: |
          pip install -r backend/requirements-ci.txt
          pip install "pact-python>=2.0.0,<3"

      - name: Syntax check — backend gateway
        run: python -m py_compile backend/gateway_v3.py

      - name: Syntax check — sovereign economy client
        run: python -m py_compile backend/sovereign_economy.py

      - name: Syntax check — training pipeline
        run: |
          for f in scripts/training/pre_train.py \
                   scripts/training/runpod_launcher.py \
                   scripts/training/kairos_dataset_gen.py \
                   scripts/training/mentor_trainer.py \
                   scripts/training/avery_flywheel.py \
                   scripts/training/merge_on_runpod.py \
                   scripts/runtime/herald.py \
                   scripts/runtime/cmd_listener.py \
                   scripts/training/train_sovereign_sft.py \
                   scripts/training/multiturn_gen.py \
                   scripts/training/ghost_trainer.py \
                   scripts/training/push_hf_cards.py; do
            if [ -f "$f" ]; then
              echo "  py_compile $f"
              python -m py_compile "$f"
            fi
          done

      - name: Run backend unit tests (live-server tests auto-skipped)
        working-directory: backend
        env:
          PYTEST_ASYNCIO_MODE: auto
          AETHYRO_SKIP_LICENSE: "1"
        run: pytest tests/ -v -m "not live and not integration" --ignore=tests/test_mesh_contract.py

      - name: Omni-Sentient Phase 1+2 gate tests
        run: |
          MVS_DRY_RUN=1 pytest tests/test_mvs_core.py tests/test_mvs_dry_run.py \
            tests/test_volatility_world.py tests/test_meta_export_validation.py \
            tests/test_theory_lab_volatility.py tests/test_loyalty_proposals.py \
            tests/test_genomic_schema.py tests/test_omni_mind_phase3.py \
            tests/test_phase2_gate.py -v --tb=short -m "not slow"

      - name: Run root unit tests
        run: pytest tests/ -v -m "not live and not integration" --tb=no || true
        env:
          PYTHONPATH: backend
          AETHYRO_SKIP_LICENSE: "1"

      - name: OSS contract smoke (shape tests, no Pact FFI)
        run: python -m pytest tests/test_oss_contract.py -q --tb=line
        env:
          PYTHONPATH: backend
          AETHYRO_SKIP_LICENSE: "1"

  pact-consumer:
    name: Pact Consumer — publish pacts
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements-ci.txt "pact-python>=2.0.0,<3"
      - name: Run Pact consumer tests (generates pacts/)
        run: python -m pytest tests/test_oss_pact.py -q --tb=line
        env:
          PYTHONPATH: backend
          AETHYRO_SKIP_LICENSE: "1"
          PACT_DO_NOT_TRACK: "true"
      - name: Upload pacts artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacts-${{ github.sha }}
          path: pacts/
          retention-days: 30
      - name: Broker health check
        if: ${{ secrets.PACT_BROKER_URL != '' }}
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: python scripts/broker_health.py || true
        continue-on-error: true
      - name: Publish to broker
        if: ${{ secrets.PACT_BROKER_URL != '' }}
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python scripts/publish_pacts.py \
            --pacts-dir pacts/ \
            --consumer-version "${GITHUB_SHA}" \
            --branch "$GIT_BRANCH" \
            --tag ci

  pact-provider:
    name: Pact Provider Verification
    runs-on: ubuntu-latest
    needs: pact-consumer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements-ci.txt "pact-python>=2.0.0,<3"
      - name: Download pacts artifact
        uses: actions/download-artifact@v4
        with:
          name: pacts-${{ github.sha }}
          path: pacts/
        continue-on-error: true
      - name: Run provider verification (TestClient mount)
        run: python -m pytest tests/test_oss_provider_verify.py -q --tb=line
        env:
          PYTHONPATH: backend
          AETHYRO_SKIP_LICENSE: "1"
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL || '' }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN || '' }}

  can-i-deploy:
    name: Can-I-Deploy Gate
    runs-on: ubuntu-latest
    needs: pact-provider
    if: ${{ secrets.PACT_BROKER_URL != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install httpx python-dotenv
      - name: Can-I-Deploy matrix check
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          python scripts/can_i_deploy.py \
            --consumer ${{ env.PACT_CONSUMER }} \
            --provider ${{ env.PACT_PROVIDER }} \
            --version "${GITHUB_SHA}" \
            --tag ci \
            --strict

  fullstack-mock:
    name: Full-stack OSS (mocked inference + Sovereign)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements-ci.txt fastapi uvicorn httpx
      - name: Run smoke with MOCK_INFERENCE
        run: |
          MOCK_INFERENCE=1 GH05T3_INFERENCE_URL=http://localhost:8010 \
          PYTHONPATH=backend python scripts/oss_smoke.py --with-inference
        env:
          AETHYRO_SKIP_LICENSE: "1"

  staging-smoke:
    name: Staging Smoke + Verification
    runs-on: ubuntu-latest
    needs: pact-provider
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.run_staging_smoke == true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements-ci.txt "pact-python>=2.0.0,<3" httpx
      - name: Run staging verify
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          python scripts/staging_verify.py \
            --broker-url "$PACT_BROKER_URL" \
            --broker-token "$PACT_BROKER_TOKEN" \
            --provider-url "$STAGING_BASE_URL" \
            --provider-name "${{ env.PACT_PROVIDER }}" \
            --consumer-tag ci

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_GW3_URL: http://localhost:8002
          CI: "false"
        run: yarn build
