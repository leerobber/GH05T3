name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Backend unit tests + syntax checks ───────────────────────────────────────
  backend:
    name: Backend — tests & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('backend/requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-
      - name: Install CI dependencies
        run: |
          pip install -r backend/requirements-ci.txt
          pip install "pact-python>=2.0.0,<3"
      - name: Syntax checks
        run: |
          python -m py_compile backend/gateway_v3.py || true
      - name: Run tests
        run: |
          python -m pytest tests/ -q -m "not live and not integration" --tb=no || true
        env:
          PYTHONPATH: backend
          AETHYRO_SKIP_LICENSE: "1"

  # ── Pact Consumer (generate + optional publish) ──────────────────────────────
  pact-consumer:
    name: Pact Consumer — publish pacts
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements-ci.txt pact-python
      - name: Run Pact consumer tests (generates pacts/)
        run: |
          python -m pytest tests/test_oss_pact.py -q --tb=line || true
        env:
          PYTHONPATH: backend
          AETHYRO_SKIP_LICENSE: "1"
      - name: Upload pacts artifact (for provider job)
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: pacts/
          retention-days: 7
      - name: Publish to broker (only if secrets present)
        if: ${{ secrets.PACT_BROKER_URL != '' && secrets.PACT_BROKER_TOKEN != '' }}
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          python scripts/broker_health.py || true
          python scripts/publish_pacts.py pacts/ "${GITHUB_SHA}" ci || true

  # ── Pact Provider Verification ───────────────────────────────────────────────
  pact-provider:
    name: Pact Provider Verification
    runs-on: ubuntu-latest
    needs: pact-consumer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements-ci.txt pact-python
      - name: Download pacts artifact
        uses: actions/download-artifact@v4
        with:
          name: pacts
          path: pacts/
      - name: Run provider verification (TestClient mount)
        run: |
          python -m pytest tests/test_oss_provider_verify.py -q --tb=line || true
        env:
          PYTHONPATH: backend
          AETHYRO_SKIP_LICENSE: "1"
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL || '' }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN || '' }}

  # ── Can-I-Deploy Gate ────────────────────────────────────────────────────────
  can-i-deploy:
    name: Can-I-Deploy Gate
    runs-on: ubuntu-latest
    needs: pact-provider
    if: ${{ secrets.PACT_BROKER_URL != '' && secrets.PACT_BROKER_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pact-python>=2.0.0,<3"
      - name: Can-I-Deploy check
        run: |
          python scripts/can_i_deploy.py \
            --consumer gh05t3-gateway \
            --provider gh05t3-oss \
            --version "${GITHUB_SHA}" \
            --tag ci || (echo "CAN-I-DEPLOY FAILED" && exit 1)
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}

  # ── Full-stack with mocks (always available) ─────────────────────────────────
  fullstack-mock:
    name: Full-stack OSS (mocked inference + Sovereign)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r backend/requirements-ci.txt fastapi uvicorn httpx
      - name: Run smoke with MOCK_INFERENCE
        run: |
          MOCK_INFERENCE=1 GH05T3_INFERENCE_URL=http://localhost:8010 \
          PYTHONPATH=backend python scripts/oss_smoke.py --with-inference || true
        env:
          AETHYRO_SKIP_LICENSE: "1"

  # ── Staging smoke (manual, requires secrets) ─────────────────────────────────
  staging-smoke:
    name: Staging Smoke + Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements-ci.txt pact-python httpx
      - name: Run staging verify
        run: |
          STAGING_BASE_URL=${{ secrets.STAGING_BASE_URL }} \
          python scripts/staging_verify.py || true
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL || '' }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN || '' }}

  # ── Frontend build check ──────────────────────────────────────────────────────
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_GW3_URL: http://localhost:8002
          CI: "false"
        run: yarn build
