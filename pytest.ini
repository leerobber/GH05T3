[pytest]
addopts = --import-mode=importlib
testpaths =
    tests
norecursedirs =
    .venv
    .git
    node_modules
    frontend/build
    frontend/node_modules
    data
    mongo-data
    models
    terminals
    backend/tests
markers =
    anyio: run async test with anyio (asyncio backend)
    asyncio: run async test with pytest-asyncio (alias — prefer anyio mark)
    slow: long-running gate tests (500-cycle theory lab)
    live: requires running backend (REACT_APP_BACKEND_URL must be set)
    wsl: requires WSL services up (WSL_SERVICES_UP=1 + wsl_start.sh)
    integration: heavy integration test — opt-in only
