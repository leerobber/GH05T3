[pytest]
testpaths =
    tests
    backend/tests
norecursedirs =
    .venv
    .git
    node_modules
    frontend/build
    frontend/node_modules
    data
    mongo-data
    models
    terminals
markers =
    anyio: run async test with anyio (asyncio backend)
    asyncio: run async test with pytest-asyncio (alias — prefer anyio mark)
